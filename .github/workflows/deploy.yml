name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Executing remote ssh commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |

            echo "🔄️ Criando .env.."
            cat << 'EOF' > /home/correvirtual/src/.env
              ${{ secrets.APP_ENV }}
            EOF

            cd /home/correvirtual

            echo "🔄️ Sincronizando .env do Postgres (docker-compose) a partir do .env do Laravel..."
            grep -E '^DB_(DATABASE|USERNAME|PASSWORD)=' src/.env | sed \
              -e 's/^DB_DATABASE=/POSTGRES_DB=/' \
              -e 's/^DB_USERNAME=/POSTGRES_USER=/' \
              -e 's/^DB_PASSWORD=/POSTGRES_PASSWORD=/' > .env

            echo "🚀 Iniciando Deploy..."
            git pull origin main
            docker-compose up -d --build
            
            docker exec corre_app php artisan migrate --force
            docker exec corre_app php artisan optimize

            echo "✅ Deploy finalizado com sucesso!"