services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: corre_app
    # Sem isso os containers não voltam depois de um reboot do servidor — foi
    # exatamente o que derrubou a produção por 9 dias (20/08 a 29/08/2026),
    # quando a VPS reiniciou por atualização de kernel. Aplicar por
    # `docker update` não resolve: qualquer recreate zera a política de volta.
    restart: unless-stopped
    volumes:
      - ./src:/var/www
      - laravel_storage:/var/www/storage

  nginx:
    image: nginx:stable-alpine
    container_name: corre_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

volumes:
  laravel_storage:
