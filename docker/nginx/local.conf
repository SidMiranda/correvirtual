# Config de desenvolvimento local — HTTP puro, sem TLS.
# A config de produção (docker/nginx/default.conf) exige certificados Let's Encrypt
# reais em /etc/letsencrypt e por isso nunca sobe numa máquina local. Ver
# docker-compose.local.yml e docs/runbook.md.

server {
    listen 80;
    server_name _;

    # Upload de imagem do evento: o padrao do nginx e 1M, e ele recusa com 413
    # ANTES do Laravel ver a requisicao — a validacao da aplicacao (5 MB por
    # arquivo) nunca chegaria a rodar. Precisa bater com post_max_size do PHP,
    # em docker/php/local.ini.
    client_max_body_size 16M;

    root /var/www/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.ht {
        deny all;
    }
}
