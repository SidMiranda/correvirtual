sys_temp_dir=/var/www/storage/app/temp
upload_tmp_dir=/var/www/storage/app/temp

; Upload de imagem do evento (banner e card): a validação da aplicação aceita
; até 5 MB por arquivo, e o formulário manda os dois de uma vez. Os padrões do
; PHP (2M / 8M) cortavam antes disso — e um upload barrado aqui chega no Laravel
; como campo vazio, sem mensagem de erro nenhuma, o que é péssimo de diagnosticar.
; O nginx tem o próprio limite, em docker/nginx/*.conf — os dois precisam bater.
upload_max_filesize=6M
post_max_size=16M
